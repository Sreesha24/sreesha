  <main>
    <section class="pg wrap" aria-labelledby="pg-title">
      <h1 class="sr-only" id="pg-title">Playground</h1>

      <!-- Filter tabs + pause -->
      <div class="pg__bar">
        <div class="pg__tabs" role="group" aria-label="Filter playground">
          <button type="button" class="pg__tab" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="pg__tab" data-filter="graphic" aria-pressed="false">Graphic Design</button>
          <button type="button" class="pg__tab" data-filter="3d" aria-pressed="false">3D &amp; Digital Art</button>
          <button type="button" class="pg__tab" data-filter="motion" aria-pressed="false">Motion</button>
        </div>
        <button type="button" class="pg__pause" id="pgPause" aria-pressed="false" aria-label="Pause motion">
          <svg class="pg__ico pg__ico--pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="pg__ico pg__ico--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
      </div>
      <p class="sr-only" role="status" id="pgStatus"></p>

      <!-- Masonry grid. Each card: data-cat = graphic | 3d | motion (space-separate for more than one).
           Tile looks: pg-card--fill (media fills the tile) or pg-card--pad (media sits on a coloured tile with its title). -->
      <ul class="pg__grid" id="pgGrid">
        <li class="pg-card pg-card--fill" data-cat="motion" style="--tile:#1e1e1e">
          <figure>
            <video src="assets/video/stopmotion.mp4" poster="assets/img/otc-stopmotion-poster.jpg" muted loop playsinline preload="metadata" aria-label="Stop-motion animation"></video>
            <figcaption>Stop-motion</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--pad" data-cat="graphic" style="--tile:#dfe9f5">
          <figure>
            <img src="assets/img/otc-flyer.webp" alt="IxDA event flyer: Keeping Agents on the Rails" width="383" height="371" loading="lazy">
            <figcaption>IxDA Indy flyer</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--pad" data-cat="3d" style="--tile:#dcf5d8">
          <figure>
            <img src="assets/img/otc-art-3.webp" alt="Glowing landscape concept art" width="364" height="193" loading="lazy">
            <figcaption>Glowing landscape</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--fill" data-cat="graphic" style="--tile:#f1efea">
          <figure>
            <img src="assets/img/otc-merch.webp" alt="Merch design" width="674" height="706" loading="lazy">
            <figcaption>Merch</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--pad" data-cat="3d" style="--tile:#d9d6cf">
          <figure>
            <img src="assets/img/otc-art-2.webp" alt="Sci-fi interior concept art" width="364" height="190" loading="lazy">
            <figcaption>Sci-fi interior</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--fill" data-cat="3d" style="--tile:#f3e6e1">
          <figure>
            <img src="assets/img/otc-artbook.webp" alt="Holding my artbook" width="394" height="486" loading="lazy">
            <figcaption>Artbook</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--fill" data-cat="graphic" style="--tile:#f5f5f3">
          <figure>
            <img src="assets/img/otc-designers-table.webp" alt="The Designer’s Table community collage" width="820" height="410" loading="lazy">
            <figcaption>The Designer’s Table</figcaption>
          </figure>
        </li>

        <li class="pg-card pg-card--pad" data-cat="3d" style="--tile:#262626;--cap:#e8e8e8">
          <figure>
            <img src="assets/img/otc-art-1.webp" alt="Environment concept art" width="364" height="174" loading="lazy">
            <figcaption>Environment study</figcaption>
          </figure>
        </li>
      </ul>
      <p class="pg__empty" id="pgEmpty" hidden>Nothing here yet — check back soon.</p>
    </section>

        <svg class="garden garden--back" id="gardenBack" aria-hidden="true"></svg>
